server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Katalog wewnątrz kontenera Nginx
    root /usr/share/nginx/html;
    index index.html;

    # Kompresja Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Bezpieczeństwo i nagłówki
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Obsługa routingu SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache'owanie zhaszowanych plików statycznych (JS, CSS, fonty)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Baza planu (schedule_data.json) - krótki cache, aby aktualizacje były szybko widoczne
    location = /schedule_data.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
